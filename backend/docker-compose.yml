# Postgres reproducible para desarrollo local.
# Las credenciales NO viven acá: se toman de backend/.env por interpolacion.
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB deben coincidir con lo que codifica DATABASE_URL.
# Uso: `docker compose up -d` desde backend/ (requiere parar un Postgres nativo en el mismo puerto).

services:
  postgres:
    image: postgres:16
    container_name: desapp_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
