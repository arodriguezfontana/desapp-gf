sonar.projectKey=arodriguezfontana_desapp-gf
sonar.organization=arodriguezfontana

# Código y tests (rutas relativas a backend/, via projectBaseDir en el CI)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts

# Cobertura generada por `pnpm test:cov`
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bootstrap/cableado: no se testea, no cuenta para cobertura
sonar.coverage.exclusions=src/main.ts,src/**/*.module.ts

# No analizar artefactos ni generados
sonar.exclusions=dist/**,generated/**,coverage/**,node_modules/**
