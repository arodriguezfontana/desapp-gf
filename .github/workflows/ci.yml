name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, 'feat/**', 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest

    # Los tests de integración/e2e levantan su propio Postgres efímero con
    # Testcontainers (constitución, Principio IX). Los runners hosteados de GitHub
    # ya traen Docker corriendo, así que no hace falta un `services:` ni DinD.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-a-real-secret

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install

      - name: Lint
        working-directory: backend
        run: pnpm lint

      - name: Test (unit)
        working-directory: backend
        run: pnpm test:unit

      - name: Test (integration)
        working-directory: backend
        run: pnpm test:integration

      - name: Test (e2e)
        working-directory: backend
        run: pnpm test:e2e

      - name: Build
        working-directory: backend
        run: pnpm build

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  sonarqube:
    name: SonarCloud
    runs-on: ubuntu-latest

    # Igual que el job backend: Testcontainers levanta el Postgres efímero.
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-a-real-secret

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: backend
        run: pnpm install
      - name: Test with coverage (unit + integration)
        working-directory: backend
        run: pnpm test:cov
      - name: Test with coverage (e2e)
        working-directory: backend
        run: pnpm test:e2e:cov
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
