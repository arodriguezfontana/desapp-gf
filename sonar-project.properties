sonar.projectKey=arodriguezfontana_desapp-gf
sonar.organization=arodriguezfontana

# Código y tests (rutas relativas a la raíz del repo, via projectBaseDir en el CI)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/src,backend/test,frontend/src,frontend/test
sonar.test.inclusions=backend/src/**/*.spec.ts,\
  backend/src/**/*.integration.spec.ts,\
  backend/test/**/*.spec.ts,\
  backend/test/**/*.e2e-spec.ts,\
  frontend/src/**/*.spec.ts,\
  frontend/src/**/*.spec.tsx,\
  frontend/test/**/*.spec.ts

# Cobertura backend: unit+integration (`pnpm test:cov`) + e2e (`pnpm test:e2e:cov`)
# Cobertura frontend: unit (`pnpm test:cov`)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage-e2e/lcov.info,frontend/coverage/lcov.info

# Bootstrap/cableado: no se testea, no cuenta para cobertura (constitución, Principio IX)
sonar.coverage.exclusions=backend/src/main.ts,backend/src/**/*.module.ts,frontend/src/main.tsx,frontend/src/vite-env.d.ts,frontend/src/App.tsx,frontend/src/routes/router.tsx,frontend/src/routes/RootLayout.tsx

# No analizar artefactos ni generados
sonar.exclusions=**/dist/**,**/generated/**,**/coverage/**,**/coverage-e2e/**,**/node_modules/**
